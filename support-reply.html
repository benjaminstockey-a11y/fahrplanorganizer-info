<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support-Antwort</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #F4F1E9;
    color: #1F3D3A;
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #57656A; font-size: 13px; margin-bottom: 24px; }
  .card {
    background: #fff;
    border: 1px solid #DCD6C6;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; color: #57656A; margin-bottom: 6px; font-weight: 600; }
  .field { margin-bottom: 8px; font-size: 14px; white-space: pre-wrap; }
  textarea, input {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #DCD6C6;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { min-height: 120px; resize: vertical; }
  button {
    background: #C9622A;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .status { margin-top: 12px; font-size: 13px; }
  .ok { color: #3F7D4F; }
  .err { color: #C0392B; }
</style>
</head>
<body>
  <h1>Support-Antwort</h1>
  <div class="sub">Bachem Fahrplanorganizer</div>

  <div class="card" id="ticketCard">
    <label>Ticket-ID</label>
    <input id="ticketId" placeholder="wird aus dem Link übernommen">
  </div>

  <div class="card" id="messageCard" style="display:none">
    <div class="field"><label>Von</label><span id="fromName"></span></div>
    <div class="field"><label>Nachricht</label><span id="origMessage"></span></div>
  </div>

  <div class="card">
    <label for="reply">Deine Antwort</label>
    <textarea id="reply" placeholder="Antwort eingeben …"></textarea>
    <div style="height:10px"></div>
    <button id="sendBtn" onclick="sendReply()">Antwort senden</button>
    <div id="status" class="status"></div>
  </div>

<script>
const PROJECT = 'bachem-support';
const BASE = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/tickets`;

function fieldValue(doc, key) {
  const f = doc && doc.fields && doc.fields[key];
  return f ? (f.stringValue || '') : '';
}

async function loadTicket(id) {
  const status = document.getElementById('status');
  try {
    const res = await fetch(`${BASE}/${id}`);
    if (!res.ok) { status.textContent = 'Ticket nicht gefunden.'; status.className = 'status err'; return; }
    const doc = await res.json();
    document.getElementById('fromName').textContent = fieldValue(doc, 'name');
    document.getElementById('origMessage').textContent = fieldValue(doc, 'message');
    document.getElementById('messageCard').style.display = 'block';
    const existingReply = fieldValue(doc, 'reply');
    if (existingReply) {
      document.getElementById('reply').value = existingReply;
      status.textContent = 'Bereits beantwortet — erneutes Senden überschreibt die Antwort.';
      status.className = 'status';
    }
  } catch (e) {
    status.textContent = 'Ticket konnte nicht geladen werden.';
    status.className = 'status err';
  }
}

async function sendReply() {
  const id = document.getElementById('ticketId').value.trim();
  const reply = document.getElementById('reply').value.trim();
  const status = document.getElementById('status');
  const btn = document.getElementById('sendBtn');
  if (!id || !reply) {
    status.textContent = 'Bitte Ticket-ID und Antwort ausfüllen.';
    status.className = 'status err';
    return;
  }
  btn.disabled = true;
  status.textContent = 'Wird gesendet …';
  status.className = 'status';
  try {
    const url = `${BASE}/${id}?updateMask.fieldPaths=reply&updateMask.fieldPaths=repliedAt`;
    const res = await fetch(url, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fields: {
          reply: { stringValue: reply },
          repliedAt: { timestampValue: new Date().toISOString() }
        }
      })
    });
    if (res.ok) {
      status.textContent = 'Antwort gesendet — die Person sieht sie beim nächsten Öffnen der App.';
      status.className = 'status ok';
    } else {
      status.textContent = 'Senden fehlgeschlagen. Ticket-ID korrekt?';
      status.className = 'status err';
    }
  } catch (e) {
    status.textContent = 'Senden fehlgeschlagen — Internetverbindung prüfen.';
    status.className = 'status err';
  } finally {
    btn.disabled = false;
  }
}

const params = new URLSearchParams(window.location.search);
const idFromUrl = params.get('id');
if (idFromUrl) {
  document.getElementById('ticketId').value = idFromUrl;
  loadTicket(idFromUrl);
}
</script>
</body>
</html>
